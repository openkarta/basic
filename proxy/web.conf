# ==========================================================================
#  web-showcase nginx — the single public gateway (:8000).
#  Serves the static MapLibre app AND reverse-proxies every backend so the
#  browser only ever talks to one same-origin host:
#
#     /              -> static app (index.html + styles/ + assets)
#     /tiles/{z}/{x}/{y} -> Martin vector tiles (same-origin, uncompressed)
#     /osrm/...      -> OSRM routing            (ok_routing_engine:5000)
#     /photon/...    -> Photon autocomplete     (ok_photon:2322)
#     /nominatim/... -> Nominatim geocoding     (ok_geocoder:8080)
#
#  Backends are not published to the host; this proxy is the only entry point.
#  Each proxied location normalises CORS (strip upstream, add a single `*`) so
#  the endpoints stay usable cross-origin without duplicate-header errors.
#
#  Martin serves gzip-encoded MVT, which MapLibre's worker mishandles in some
#  Chromium builds ("Unimplemented type" -> blank map). The /tiles/ location
#  strips Accept-Encoding upstream so Martin returns identity (plain PBF).
# ==========================================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static app + downloaded styles (/styles/*.json).
    location / {
        try_files $uri $uri/ =404;
    }

    # docsify API reference (mounted separately at /srv/docs to avoid nesting
    # under the read-only app mount). Hash-routed, so no SPA fallback needed.
    location = /docs { return 301 /docs/; }
    location /docs/ {
        alias /srv/docs/;
        index index.html;
    }

    # Uncompressed, same-origin vector tiles: /tiles/{z}/{x}/{y} (what the app uses)
    location /tiles/ {
        proxy_pass            http://ok_tile_server:3000/ethiopia-latest/;
        proxy_http_version    1.1;
        proxy_set_header      Accept-Encoding "";   # force Martin -> identity (no gzip)
        proxy_set_header      Host $host;
        gzip                  off;                  # do not re-compress
        proxy_hide_header     Access-Control-Allow-Origin;
        add_header            Access-Control-Allow-Origin "*" always;
        add_header            Cache-Control "public, max-age=3600";
    }

    # Full Martin API: /martin/catalog, /martin/ethiopia-latest (TileJSON), /martin/health
    location /martin/ {
        proxy_pass        http://ok_tile_server:3000/;
        proxy_set_header  Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header        Access-Control-Allow-Origin "*" always;
    }

    # Routing engine (OSRM): /osrm/route/v1/...  /osrm/nearest/v1/...  etc.
    location /osrm/ {
        proxy_pass        http://ok_routing_engine:5000/;
        proxy_set_header  Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header        Access-Control-Allow-Origin "*" always;
    }

    # Type-ahead autocomplete (Photon): /photon/api?q=...  /photon/reverse?...
    location /photon/ {
        proxy_pass        http://ok_photon:2322/;
        proxy_set_header  Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header        Access-Control-Allow-Origin "*" always;
    }

    # Full geocoder (Nominatim): /nominatim/search  /nominatim/reverse  etc.
    location /nominatim/ {
        proxy_pass        http://ok_geocoder:8080/;
        proxy_set_header  Host $host;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header        Access-Control-Allow-Origin "*" always;
    }

    # Vehicle-routing optimization (VROOM): POST /vroom/ , GET /vroom/health
    # Cross-origin JSON POSTs are preflighted by browsers, and vroom-express
    # doesn't answer OPTIONS itself — so the gateway does. (The GET endpoints
    # above are CORS "simple requests" and need no preflight.)
    # 308 keeps the POST method + body when adding the trailing slash;
    # absolute_redirect off keeps the client's host:port in the Location, and
    # the 308 carries CORS too — a cross-origin caller hitting /vroom (no
    # slash) would otherwise die at the redirect.
    location = /vroom {
        absolute_redirect off;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "*" always;
        return 308 /vroom/;
    }
    location /vroom/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }
        proxy_pass         http://ok_vroom:3000/;
        proxy_set_header   Host $host;
        proxy_read_timeout 320s;          # VRP solves can take a while
        proxy_hide_header  Access-Control-Allow-Origin;
        add_header         Access-Control-Allow-Origin "*" always;
    }
}
