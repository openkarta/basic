# vroom-express config — Open Karta.
# VROOM (vehicle-routing optimization) using the OSRM driver, pointed at our
# existing routing engine. osrm-routed ignores the URL profile segment, so the
# `car` key works against the loaded Ethiopia `driving` graph.
cliArgs:
  geometry: true          # return route geometry (-g) so solutions can be drawn
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '..'
  logsize: '100M'
  maxlocations: 1000      # max jobs/shipments locations per request
  maxvehicles: 200
  override: ['c', 'g', 'l', 't', 'x']
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
routingServers:
  osrm:
    car:
      host: 'ok_routing_engine'   # our OSRM container
      port: '5000'
